# RHWP Studio 데스크톱 릴리스 빌드
#
# `studio-v<버전>` 태그를 push하면 Windows(NSIS)·macOS(dmg) 설치 파일과 자동 업데이트
# 패키지를 빌드·서명해 workflow artifacts로 남긴다.
#
# 포털(portal.kdsys.co.kr)은 사내 DNS 전용이라 GitHub 러너가 접근할 수 없다 —
# 게시는 사내 작업 머신에서 scripts/desktop-release/publish-from-ci.sh가 이 run의
# artifacts를 내려받아 수행한다 (cut-release.sh가 태그 push 후 자동으로 이어서 실행).
#
# 필요한 저장소 secrets:
# - TAURI_SIGNING_PRIVATE_KEY   업데이트 패키지 minisign 개인키 (암호 없음)
# - WINDOWS_CERT_CER_B64        (선택) 사내 배포용 공개 인증서(.cer) base64 — 없으면
#                               CI가 1회용 인증서를 만들어 번들 리소스 요건만 채운다.
name: Desktop Release

on:
  push:
    tags: ['studio-v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows는 사내 셀프호스티드 러너에서 빌드한다 — GitHub 호스티드 러너의
          # 콜드 캐시 때문에 매 릴리스 20~40분이 걸리던 것을 줄이기 위함.
          # 작업 디렉터리를 유지(checkout-clean: false)해 Cargo/target 증분 빌드를
          # 재사용하므로 rust-cache 업로드도 생략한다.
          - os: [self-hosted, Windows, X64]
            name: windows
            checkout-clean: false
            rust-targets: wasm32-unknown-unknown
            tauri-build-args: ''
            bundle-paths: |
              rhwp-studio/src-tauri/target/release/bundle/nsis/*.exe
              rhwp-studio/src-tauri/target/release/bundle/nsis/*.exe.sig
          # macOS는 universal(arm64+x86_64) 단일 번들로 빌드한다 — Apple Silicon과
          # 인텔 맥 모두 같은 dmg/업데이트 패키지를 쓴다.
          - os: macos-latest
            name: macos
            checkout-clean: true
            rust-targets: wasm32-unknown-unknown,x86_64-apple-darwin,aarch64-apple-darwin
            tauri-build-args: '--target universal-apple-darwin'
            bundle-paths: |
              rhwp-studio/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              rhwp-studio/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
              rhwp-studio/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 셀프호스티드(Windows): 이전 빌드의 target/·node_modules를 지우지 않고
          # 재사용한다. 추적 파일은 fetch+reset으로 태그 시점과 일치한다.
          clean: ${{ matrix.checkout-clean }}

      - name: 태그와 tauri.conf.json 버전 일치 확인
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#studio-v}"
          conf_ver="$(node -p "require('./rhwp-studio/src-tauri/tauri.conf.json').version")"
          if [ "$ver" != "$conf_ver" ]; then
            echo "태그 버전($ver)과 tauri.conf.json 버전($conf_ver)이 다릅니다." >&2
            exit 1
          fi

      - name: 배포 인증서 준비
        shell: bash
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERT_CER_B64 }}
          # Git Bash(Windows)가 "/CN=..." 인자를 Windows 경로로 바꿔치기하지 않게 한다.
          MSYS_NO_PATHCONV: '1'
        run: |
          mkdir -p rhwp-studio/src-tauri/packaging/cert
          dest="rhwp-studio/src-tauri/packaging/cert/rhwp-studio-cert.cer"
          if [ -n "$CERT_B64" ]; then
            printf '%s' "$CERT_B64" | base64 -d > "$dest"
            echo "secrets의 사내 인증서를 사용합니다."
          else
            # 번들 리소스 요건만 채우는 1회용 인증서 — 설치 훅의 certutil 등록이
            # 실패해도 설치는 계속되므로(installer-hooks.nsh) 무해하다.
            openssl req -x509 -newkey rsa:2048 -keyout ci-cert-key.pem \
              -out ci-cert.pem -days 30 -nodes -subj "/CN=RHWP Studio CI"
            openssl x509 -in ci-cert.pem -outform der -out "$dest"
            rm -f ci-cert-key.pem ci-cert.pem
            echo "secrets에 인증서가 없어 1회용 인증서를 만들었습니다."
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        # 셀프호스티드 러너는 작업 디렉터리의 target이 그대로 남으므로 캐시가 불필요하다.
        if: matrix.name == 'macos'
        with:
          workspaces: |
            . -> target
            rhwp-studio/src-tauri -> rhwp-studio/src-tauri/target

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: rhwp-studio/package-lock.json

      - name: wasm-pack 설치
        shell: bash
        run: npm install -g wasm-pack

      - name: WASM 빌드
        shell: bash
        run: bash scripts/wasm-pack-locked.sh --target web --out-dir pkg

      - name: 프런트엔드 의존성 설치
        working-directory: rhwp-studio
        run: npm ci

      - name: Tauri 번들 빌드 (업데이트 패키지 서명 포함)
        working-directory: rhwp-studio
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: npm run tauri:build -- ${{ matrix.tauri-build-args }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: ${{ matrix.bundle-paths }}
          if-no-files-found: error
